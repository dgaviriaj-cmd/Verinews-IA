name: VeriNews AI - Runner smoke test

on:
  push:
    branches:
      - migration/html-css-js-python

permissions:
  contents: read

jobs:
  runner-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirm GitHub-hosted runner starts
        run: |
          echo "GitHub Actions runner started successfully."
          python --version
          node --version
          npm --version
