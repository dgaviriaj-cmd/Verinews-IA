services:
  - type: web
    name: verinews-ai
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt && npm install && npm run build
    startCommand: python app.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PORT
        value: 5000
